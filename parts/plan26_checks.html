        <p class="pintro g26">Most of these are in the Camera and Controller Settings menus. Tick each one once it is set.</p>
        <ul class="checks g26">
          <li><label><input type="checkbox" data-chk="f26-cam"><span><b>Camera: Co-Op, Height 20, Zoom 0.</b> You see almost the whole pitch, so free men and runners jump out. Too far away? Tele Broadcast at the same height and zoom. <a class="src" href="https://realsport101.com/article/fc-26-game-settings-best-controller-camera-settings" target="_blank" rel="noopener">RealSport101</a> · <a class="src" href="https://www.dexerto.com/wikis/ea-fc-26-guides-walkthrough-tips/best-camera-settings/" target="_blank" rel="noopener">Dexerto</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-pzoom"><span><b>Power Shot Zoom: Off.</b> The camera stops moving in on power shots, so the box stays in view. <a class="src" href="https://realsport101.com/article/fc-26-game-settings-best-controller-camera-settings" target="_blank" rel="noopener">RealSport101</a> · <a class="src" href="https://earlygame.com/de/guides/fifa/ea-fc-26-die-besten-controller-einstellungen-fuer-einen-perfekten-start" target="_blank" rel="noopener">EarlyGame settings (German)</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-radar"><span><b>Radar: 2D.</b> One glance shows the far side. My pick: FC 26 guides don’t name one.</span></label></li>
          <li><label><input type="checkbox" data-chk="f26-ind"><span><b>Next Player Switch Indicator: On.</b> Shows who you get when you press LB, so you switch to the right man first time. <a class="src" href="https://www.ea.com/able/resources/ea-sports-fc/fc-26" target="_blank" rel="noopener">EA settings guide</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-auto"><span><b>Auto Switching: Air Balls and Loose Balls. Auto Switching Move Assistance: None.</b> The game only switches for you on balls in the air and loose balls, and doesn’t keep your new player running in his old direction. <a class="src" href="https://realsport101.com/article/fc-26-game-settings-best-controller-camera-settings" target="_blank" rel="noopener">RealSport101</a> · <a class="src" href="https://earlygame.com/de/guides/fifa/ea-fc-26-die-besten-controller-einstellungen-fuer-einen-perfekten-start" target="_blank" rel="noopener">EarlyGame settings (German)</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-lock"><span><b>Pass Receiver Lock: Late.</b> You can change who the pass goes to at the last moment if a lane closes. <a class="src" href="https://www.redbull.com/us-en/ea-fc-26-best-controller-and-gameplay-settings" target="_blank" rel="noopener">Red Bull settings</a> · <a class="src" href="https://realsport101.com/article/fc-26-game-settings-best-controller-camera-settings" target="_blank" rel="noopener">RealSport101</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-assist"><span><b>Ground Pass: Assisted. Through Pass: Semi. Lobbed Through Pass: Semi. Shot Assistance: Assisted.</b> Full help on the passes you play most, more control over through balls. Some guides pick Precision for shots. <a class="src" href="https://realsport101.com/article/fc-26-game-settings-best-controller-camera-settings" target="_blank" rel="noopener">RealSport101</a> · <a class="src" href="https://www.sportskeeda.com/gaming-tech/best-ea-fc-26-controller-and-game-settings" target="_blank" rel="noopener">Sportskeeda</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-def"><span><b>Defending: Tactical.</b> Keeps hold A as Contain, the way the clips here use it. On the default, Advanced, hold A is a physical tackle. <a class="src" href="https://www.fifplay.com/fc-26-controls/" target="_blank" rel="noopener">FIFPlay controls</a> · <a class="src" href="https://www.ea.com/able/resources/ea-sports-fc/fc-26" target="_blank" rel="noopener">EA settings guide</a> · <a class="src" href="https://www.redbull.com/us-en/ea-fc-26-best-controller-and-gameplay-settings" target="_blank" rel="noopener">Red Bull settings</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-shot"><span><b>Learn the new low shot: double-tap B.</b> Timed Finishing is gone in FC 26. A double-tap of B is now a low driven shot. <a class="src" href="https://www.ea.com/games/ea-sports-fc/fc-26/news/pitch-notes-fc26-gameplay-deep-dive" target="_blank" rel="noopener">EA Deep Dive</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-tac"><span><b>Tactics: Build-Up Style Balanced, Defensive Approach Balanced, Line Height 45.</b> Balanced build-up gives you runners and short options. A line just under the default 50 means fewer balls in behind you. <a class="src" href="https://www.ea.com/games/ea-sports-fc/fc-26/news/pitch-notes-fc26-gameplay-deep-dive" target="_blank" rel="noopener">EA Deep Dive</a> · <a class="src" href="https://www.ea.com/games/ea-sports-fc/fc-25/news/pitch-notes-fc-25-fc-iq-deep-dive" target="_blank" rel="noopener">EA FC IQ (FC 25)</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-roles"><span><b>Roles in 4-3-3 (4), also listed as 4-3-3 Attack.</b> <br>Striker: Advanced Forward (Attack)<br>Wingers: Inside Forward (Balanced)<br>CAM: Shadow Striker (Attack)<br>One CM: Deep-Lying Playmaker (Build-Up)<br>Other CM: Box-to-Box (Balanced)<br>Full-backs: Fullback (Defend)<br>CBs: Defender (Defend)<br>Based on fut.gg’s FC 26 4-3-3 (4), with both full-backs on Defend. <a class="src" href="https://www.fut.gg/news/4-3-34-custom-tactics-the-hyper-aggressive-setup-to-break-ai-defending-in-fc-26/" target="_blank" rel="noopener">fut.gg 4-3-3 (4)</a></span></label></li>
          <li><label><input type="checkbox" data-chk="f26-warm"><span><b>One round of the Scan trainer at Legendary speed.</b> Wakes your eyes up before the first whistle.</span></label></li>
        </ul>
